<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE DRIXZOID FILES</title>
  <meta name="description" content="Explore the drixzoid files if you dare...">
  <meta name="theme-color" content="#7c5cff">

  <!-- Icons (tab icon, bookmarks, iOS home screen) -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="shortcut icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Open Graph / Discord embed -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="THE DRIXZOID FILES">
  <meta property="og:title" content="THE DRIXZOID FILES">
  <meta property="og:description" content="Explore the drixzoid files if you dare...">
  <meta property="og:url" content="https://zero-fx1.github.io/youtuberfiles/">
  <meta property="og:image" content="https://zero-fx1.github.io/youtuberfiles/logo.png">
  <meta property="og:image:alt" content="THE DRIXZOID FILES logo">

  <!-- Twitter / generic card (Discord also reads these) -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="THE DRIXZOID FILES">
  <meta name="twitter:description" content="Explore the drixzoid files if you dare...">
  <meta name="twitter:image" content="https://zero-fx1.github.io/youtuberfiles/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="grid"></span>
  </div>

  <main class="container">
    <header class="hero">
      <img class="logo" src="logo.png" alt="" onerror="this.style.display='none'">
      <h1 data-text="THE DRIXZOID FILES">THE DRIXZOID FILES</h1>
      <p class="tagline">Explore the files if you dare<span class="cursor">_</span></p>
    </header>

    <section class="controls">
      <label class="search-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search all files..." autocomplete="off">
      </label>
      <select id="sort" aria-label="Sort">
        <option value="name">Sort by name</option>
        <option value="size">Sort by size</option>
      </select>
    </section>

    <nav id="path" class="crumbs" aria-label="Breadcrumb"></nav>
    <div id="stats" class="stats"></div>
    <div id="list"></div>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <img alt="">
  </div>

  <script src="script.js"></script>
</body>
</html>
